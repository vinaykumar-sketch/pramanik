<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Scan — Pramanik</title>
<style>
  :root {
    --ink-navy: #1E2A47;
    --paper: #F1F3F2;
    --paper-dim: #E6E9E7;
    --slate: #64748B;
    --amber: #C97A1F;
    --verdict-low: #2E8B65;
    --verdict-medium: #B8860B;
    --verdict-high: #B23A32;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink-navy);
    line-height: 1.6;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  .eyebrow {
    color: var(--amber);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 24px 0;
    letter-spacing: -0.01em;
  }

  .card {
    background: white;
    border: 1px solid var(--paper-dim);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .verdict-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 100px;
    color: white;
    margin-bottom: 14px;
  }

  .verdict-badge.low { background: var(--verdict-low); }
  .verdict-badge.medium { background: var(--verdict-medium); }
  .verdict-badge.high { background: var(--verdict-high); }

  .label {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px 0;
  }

  .score {
    color: var(--slate);
    font-size: 14px;
    margin: 0 0 20px 0;
  }

  .signals-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px 0;
  }

  .signals-list {
    margin: 0;
    padding-left: 20px;
    color: var(--slate);
    font-size: 14px;
  }

  .signals-list li {
    margin-bottom: 6px;
  }

  .disclaimer {
    color: var(--slate);
    font-size: 12.5px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--paper-dim);
  }

  .state-text {
    color: var(--slate);
    font-size: 15px;
  }

  .cta {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 18px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    background: var(--ink-navy);
    color: var(--paper);
  }

  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--paper-dim);
    color: var(--slate);
    font-size: 13px;
  }

  footer a { color: var(--ink-navy); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Pramanik</div>
    <h1>Verified Scan Result</h1>

    <div id="content" class="card">
      <p class="state-text">Loading…</p>
    </div>

    <a class="cta" href="/">About Pramanik</a>

    <footer>
      &copy; 2026 Pramanik
    </footer>
  </div>

  <script>
    const BACKEND_URL = "https://photo-authenticity-backend.onrender.com";

    function scanIdFromPath() {
      // Path is /verify/{scan_id} — take the last non-empty segment.
      const parts = window.location.pathname.split("/").filter(Boolean);
      return parts[parts.length - 1];
    }

    function verdictClass(verdict) {
      if (verdict === "high") return "high";
      if (verdict === "medium") return "medium";
      return "low";
    }

    async function loadScan() {
      const contentEl = document.getElementById("content");
      const scanId = scanIdFromPath();

      if (!scanId || scanId === "verify") {
        contentEl.innerHTML = '<p class="state-text">No scan ID provided.</p>';
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/verify/${scanId}`);

        if (response.status === 404) {
          contentEl.innerHTML = '<p class="state-text">This scan could not be found. The link may be incorrect, or the scan may no longer be available.</p>';
          return;
        }

        if (!response.ok) {
          contentEl.innerHTML = '<p class="state-text">Something went wrong loading this scan. Please try again later.</p>';
          return;
        }

        const data = await response.json();
        renderScan(contentEl, data);
      } catch (err) {
        contentEl.innerHTML = '<p class="state-text">Couldn\\'t reach the verification service. Check your connection and try again.</p>';
      }
    }

    function renderScan(contentEl, data) {
      const vClass = verdictClass(data.verdict);
      const signalsHtml = (data.top_signals || [])
        .map(signal => `<li>${escapeHtml(signal)}</li>`)
        .join("");

      contentEl.innerHTML = `
        <div class="verdict-badge ${vClass}">${escapeHtml(data.verdict)}</div>
        <p class="label">${escapeHtml(data.label)}</p>
        <p class="score">AI-generation score: ${data.ai_generated_score.toFixed(1)}%</p>
        ${signalsHtml ? `
          <p class="signals-title">Key Signals</p>
          <ul class="signals-list">${signalsHtml}</ul>
        ` : ""}
        <p class="disclaimer">This result is a probabilistic estimate, not a legal or forensic certification. It should not be the sole basis for accusations against a real person.</p>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    loadScan();
  </script>
</body>
</html>
